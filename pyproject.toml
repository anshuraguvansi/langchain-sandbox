[project]
name = "langchain-sandbox"
version = "0.1.0"
description = "Step-by-step LangChain learning playground"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncio>=4.0.0",
    "defusedxml>=0.7.1",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=0.3.0",
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
loaders = [
    "beautifulsoup4>=4.15.0",
    "jq>=1.12.0",
    "langchain-unstructured>=1.0.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "unstructured[csv]>=0.18.32",
]
splitters = [
    "beautifulsoup4>=4.15.0",
    "langchain-text-splitters>=1.1.2",
    "lxml>=6.1.3",
    "nltk>=3.10.3",
    "spacy>=3.8.16",
    "tiktoken>=0.14.0",
]

[tool.uv]
package = false
